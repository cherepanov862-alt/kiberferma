<title>КиберФерма 3D — вход</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;color:#e6f0ff;font:15px/1.45 "Segoe UI",system-ui,sans-serif;padding:16px;
  background:
   radial-gradient(800px 480px at 15% 10%,rgba(162,59,255,.28),transparent 60%),
   radial-gradient(800px 480px at 85% 90%,rgba(40,210,255,.2),transparent 60%),
   linear-gradient(rgba(40,210,255,.06) 1px,transparent 1px) 0 0/28px 28px,
   linear-gradient(90deg,rgba(40,210,255,.06) 1px,transparent 1px) 0 0/28px 28px,#04050d}
.box{width:100%;max-width:440px;padding:30px 26px 24px;background:rgba(8,11,26,.92);border:1px solid #28d2ff;
  box-shadow:0 0 26px rgba(40,210,255,.45),inset 0 0 30px rgba(162,59,255,.14);text-align:center;
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.logo{width:64px;height:70px;margin:0 auto 14px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#28d2ff;
  background:linear-gradient(160deg,#28d2ff,#a23bff);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);position:relative}
.logo::before{content:"";position:absolute;inset:4px;background:#060916;clip-path:inherit}
.logo span{position:relative;text-shadow:0 0 10px #28d2ff}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.5px}
h1 i{font-style:normal;background:linear-gradient(180deg,#fff 0%,#c9d3e6 45%,#6f7c98 55%,#e9eef8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 b{color:#28d2ff;text-shadow:0 0 12px #28d2ff}
p{margin:6px 0 18px;color:#7f8db5;font-size:11.5px;text-transform:uppercase;letter-spacing:1.6px}
.dev{border:1px dashed #a23bff;background:rgba(162,59,255,.1);padding:10px 12px;margin-bottom:16px}
.dev span{display:block;font-size:11px;color:#b9a4e6;text-transform:uppercase;letter-spacing:1.2px}
.dev b{display:block;margin:4px 0 6px;font:700 24px Consolas,monospace;color:#fff;letter-spacing:3px;user-select:all}
.dev button{width:auto;margin:0;padding:6px 14px;font-size:11px;letter-spacing:1px;background:#a23bff;color:#fff}
input{width:100%;padding:13px 12px;background:#070b19;border:1px solid #1c2a57;color:#28d2ff;font:700 17px Consolas,monospace;text-align:center;letter-spacing:1px;text-transform:uppercase}
input:focus{outline:none;border-color:#28d2ff;box-shadow:0 0 12px rgba(40,210,255,.6)}
input::placeholder{color:#33406b}
button{width:100%;margin-top:12px;padding:13px;border:0;cursor:pointer;font:800 14px inherit;text-transform:uppercase;letter-spacing:2px;color:#03101a;
  background:linear-gradient(90deg,#28d2ff,#a23bff);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
button:hover{filter:brightness(1.15)}
#err{min-height:20px;margin-top:12px;color:#ff6b8b;font-size:13px;font-weight:600}
small{display:block;margin-top:8px;color:#566390;font-size:12px}
</style>
</head>

var ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

var K=[],H0=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225];
(function(){for(var c=2;K.length<64;c++){var p=true;for(var d=2;d*d<=c;d++)if(c%d===0){p=false;break;}if(p)K.push((Math.pow(c,1/3)%1)*4294967296>>>0);}})();
function rr(x,n){return (x>>>n)|(x<<(32-n));}
function sha256(m){
  var l=m.length,n=((l+72)>>6)<<6,b=new Uint8Array(n);b.set(m);b[l]=128;
  var dv=new DataView(b.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l/536870912));
  var h=H0.slice(),w=new Uint32Array(64);
  for(var o=0;o<n;o+=64){
    var i;for(i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(i=16;i<64;i++){var x=w[i-15],y=w[i-2];w[i]=w[i-16]+(rr(x,7)^rr(x,18)^(x>>>3))+w[i-7]+(rr(y,17)^rr(y,19)^(y>>>10));}
    var a=h[0],bb=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for(i=0;i<64;i++){
      var t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0;
      var t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&c)^(bb&c)))>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0;
    }
    h=[h[0]+a,h[1]+bb,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+hh].map(function(v){return v>>>0;});

function enc(s){return new TextEncoder().encode(s);}
function raw(s){var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function cat(){var n=0,i;for(i=0;i<arguments.length;i++)n+=arguments[i].length;var r=new Uint8Array(n),o=0;for(i=0;i<arguments.length;i++){r.set(arguments[i],o);o+=arguments[i].length;}return r;}
function hex(b){var s='';for(var i=0;i<b.length;i++)s+=(b[i]<16?'0':'')+b[i].toString(16);return s;}
function unhex(s){var a=new Uint8Array(s.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(s.substr(i*2,2),16);return a;}
function b32(bytes,n){var bits='',s='',i;for(i=0;i<bytes.length;i++)bits+=('0000000'+bytes[i].toString(2)).slice(-8);for(i=0;i<n;i++)s+=ALPH[parseInt(bits.substr(i*5,5),2)];return s;}

// Код устройства: видеокарта, ядра, система, часовой пояс, сенсор. Версия браузера не входит.
// Память (deviceMemory) не берём: браузер даёт её только сайтам по https, у локального файла код вышел бы другим.
function deviceCode(){
  var r='';
  try{var c=document.createElement('canvas'),g=c.getContext('webgl')||c.getContext('experimental-webgl');
    var x=g.getExtension('WEBGL_debug_renderer_info');r=(x?g.getParameter(x.UNMASKED_VENDOR_WEBGL)+'/'+g.getParameter(x.UNMASKED_RENDERER_WEBGL):g.getParameter(g.RENDERER))||'';}catch(e){}
  var tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';}catch(e){}
  var s=['kf3d-dev-2',r,navigator.hardwareConcurrency||0,navigator.platform||'',tz,navigator.maxTouchPoints||0].join('|');
  return b32(sha256(enc(s)),10);
}
var DEV=deviceCode();
document.getElementById('dc').textContent=DEV.slice(0,5)+'-'+DEV.slice(5);
document.getElementById('cp').onclick=function(){
  var t=DEV.slice(0,5)+'-'+DEV.slice(5), b=this;
  function done(){b.textContent='Скопировано';setTimeout(function(){b.textContent='Скопировать';},1500);}
  try{navigator.clipboard.writeText(t).then(done,function(){prompt('Код устройства:',t);});}catch(e){prompt('Код устройства:',t);}
};

function unlock(key){
  var k=key.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(k.length===20&&k.slice(0,4)==='KF3D') k=k.slice(4);
  k=k.split('').filter(function(c){return ALPH.indexOf(c)>=0;}).join('');
  if(k.length!==16) return null;
  var a=unb32(k), pad=sha256(cat(raw('dev'),SALT,raw(DEV))), master=new Uint8Array(10);
  for(var i=0;i<10;i++) master[i]=a[i]^pad[i];
  var ck=sha256(cat(raw('ck'),master)), ct=raw(atob(DATA));
  if(hex(sha256(cat(ck,raw('mac'),ct)))!==MAC) return null;
  var pre=cat(ck,raw('ctr'),new Uint8Array(4)), n=pre.length;
  for(var o=0,j=0;o<ct.length;o+=32,j++){
    pre[n-4]=j>>>24;pre[n-3]=j>>>16&255;pre[n-2]=j>>>8&255;pre[n-1]=j&255;
    var ks=sha256(pre); for(i=0;i<32&&o+i<ct.length;i++) ct[o+i]^=ks[i];
  }
  return new TextDecoder('utf-8').decode(ct);
}
function open_(key){
  var html=unlock(key); if(!html) return false;
  try{localStorage.setItem('kf3d_key',key);}catch(e){}
  document.open();document.write(html);document.close();
  return true;
}
// Автовход по сохранённому ключу — только после полной загрузки страницы входа.
// Если вызвать document.write, пока страница ещё грузится, генератор допишется
// к форме входа, а не заменит её.
var saved=null; try{saved=localStorage.getItem('kf3d_key');}catch(e){}
if(saved){
  document.documentElement.style.visibility='hidden';
  window.addEventListener('load',function(){
    setTimeout(function(){
      if(open_(saved)) return;
      try{localStorage.removeItem('kf3d_key');}catch(e){}
      document.documentElement.style.visibility='';
    },0);
  });
}
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var err=document.getElementById('err'); err.textContent='Проверяю…';
  setTimeout(function(){ if(!open_(document.getElementById('k').value)) err.textContent='Ключ не подходит к этому устройству. Проверьте ключ или пришлите код устройства заново.'; },30);
});
})();
